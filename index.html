<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGzone - Sklep Pokémon TCG</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Bardzo kolorowe, energetyczne tło nawiązujące do Pokémonów */
            background: linear-gradient(135deg, #ff0055, #ffcc00, #00d2ff, #7928ca);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff; 
            margin: 0;
            padding: 0;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Ekran główny (Startowy) */
        #home-screen {
            display: block;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Klimatyczne tło z Pikachu/Pokémonami */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        h1 { color: #ffcb05; font-size: 3.5em; text-shadow: 3px 3px 8px rgba(0,0,0,0.9); margin-bottom: 10px; }
        .subtitle { color: #ffffff; font-size: 1.4em; font-weight: bold; margin-bottom: 35px; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); }
        
        .btn-primary {
            background-color: #ffcb05;
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 203, 5, 0.6);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-primary:hover { background-color: #e6b800; transform: scale(1.08); }

        /* Ekran Sklepu (Katalog z suwakiem i kolorowym tłem) */
        #shop-screen {
            display: none;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .shop-header {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            max-width: 800px;
            margin: 0 auto 30px auto;
            border: 2px solid #ffcb05;
            backdrop-filter: blur(5px);
        }
        
        .shop-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .product-card { 
            border: 2px solid #ffcb05; 
            border-radius: 15px; 
            width: 280px; 
            background: rgba(26, 26, 46, 0.95); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(255, 203, 5, 0.5);
        }
        .product-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-bottom: 2px solid #ffcb05;
        }
        .product-info { padding: 15px; text-align: left; }
        .product-card h3 { color: #ffcb05; margin: 0 0 8px 0; font-size: 1.25em; }
        .product-card .price { font-size: 1.4em; font-weight: bold; color: #00ffcc; margin-top: 10px; }
        
        .details-btn {
            background-color: #ffcb05;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.05em;
            transition: background 0.2s;
        }
        .details-btn:hover { background-color: #e6b800; }

        /* Ekran Szczegółów Produktu */
        #detail-screen {
            display: none;
            padding: 50px 20px;
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .detail-card {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffcb05;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .detail-img {
            max-width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #00ffcc;
            margin-bottom: 20px;
        }
        .detail-card h2 { color: #ffcb05; font-size: 2.2em; margin-top: 0; }
        .detail-price { font-size: 1.8em; color: #00ffcc; font-weight: bold; margin: 15px 0; }
        .detail-desc { color: #ddd; font-size: 1.15em; line-height: 1.6; margin-bottom: 25px; text-align: left; }

        .back-btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #ffcb05;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .back-btn:hover { background-color: #444; }
        
        footer {
            background: rgba(0,0,0,0.8);
            color: #aaa;
            padding: 20px;
            font-size: 0.95em;
            border-top: 1px solid #444;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- 1. EKRAN GŁÓWNY -->
    <div id="home-screen">
        <h1>TCG Zone</h1>
        <p class="subtitle">Oficjalny sklep z zestawami i kartami Pokémon TCG</p>
        <button class="btn-primary" onclick="otworzSklep()">Przejdź do świata Pokémon</button>
    </div>

    <!-- 2. EKRAN SKLEPU (KATALOG Z ASORTYMENTEM) -->
    <div id="shop-screen">
        <div class="shop-header">
            <h1 style="color: #ffcb05; margin: 0 0 10px 0; font-size: 2.5em;">Katalog Sklepu TCGzone</h1>
            <p style="color: #ddd; margin: 0; font-size: 1.1em;">Przewiń w dół, wybierz interesujący Cię zestaw i kliknij, aby poznać szczegóły!</p>
        </div>
        
        <div class="shop-grid" id="product-list">
            <!-- Produkty wczytują się automatycznie z poniższej bazy danych JavaScript -->
        </div>

        <button class="back-btn" onclick="pokazStart()" style="margin-top: 40px;">← Wróć do strony powitalnej</button>
    </div>

    <!-- 3. EKRAN SZCZEGÓŁÓW PRODUKTU -->
    <div id="detail-screen">
        <div class="detail-card" id="detail-content">
            <!-- Dynamiczne szczegóły -->
        </div>
        <button class="back-btn" onclick="otworzSklep()">← Wróć do katalogu</button>
    </div>

    <footer>
        <p>&copy; 2026 TCG Zone. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <script>
        // =========================================================================
        // BAZA PRODUKTÓW - TUTAJ W PROSTY SPOSÓB DODAJESZ NOWE ASORTYMENTY!
        // Wystarczy skopiować klamry {} i zmienić nazwę, cenę, zdjęcie oraz opis.
        // =========================================================================
        const produkty = [
            {
                id: 1,
                nazwa: "Elite Trainer Box 30th Anniversary",
                cena: "299.00 zł",
                zdjęcie: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80",
                opis: "Wyjątkowa, jubileuszowa edycja Elite Trainer Box! W środku znajdziesz kolekcjonerskie boostery z unikalnymi kartami, specjalne koszulki na karty z jubileuszowym nadrukiem, kości, znaczniki oraz ekskluzywną kartę promo."
            },
            {
                id: 2,
                nazwa: "Booster Box - Najnowsza Seria",
                cena: "649.00 zł",
                zdjęcie: "https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=600&q=80",
                opis: "Fabrycznie zamknięty Booster Box zawierający aż 36 boosterów. Idealny wybór dla kolekcjonerów szukających rzadkich kart Secret Rare oraz pełnych artów."
            },
            {
                id: 3,
                nazwa: "Elite Trainer Box (Standard)",
                cena: "229.00 zł",
                zdjęcie: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80",
                opis: "Standardowy zestaw gracza i kolekcjonera: 9 boosterów, przewodnik po serii, koszulki ochronne na karty, przekładki do decku oraz zestaw znaczników."
            },
            {
                id: 4,
                nazwa: "Pojedynczy Booster",
                cena: "21.99 zł",
                zdjęcie: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80",
                opis: "Oryginalnie zafoliowana saszetka zawierająca 10 losowych kart oraz kod do gry Pokémon TCG Live."
            }
        ];

        // Logika przełączania widoków
        function otworzSklep() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('shop-screen').style.display = 'block';
            window.scrollTo(0, 0);
            renderujProdukty();
        }

        function pokazStart() {
            document.getElementById('shop-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function renderujProdukty() {
            const kontener = document.getElementById('product-list');
            kontener.innerHTML = '';
            
            produkty.forEach(produkt => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => pokazSzczegoly(produkt.id);
                card.innerHTML = `
                    <img src="${produkt.zdjęcie}" alt="${produkt.nazwa}" class="product-img">
                    <div class="product-info">
                        <h3>${produkt.nazwa}</h3>
                        <div class="price">${produkt.cena}</div>
                    </div>
                    <button class="details-btn">Zobacz szczegóły</button>
                `;
                kontener.appendChild(card);
            });
        }

        function pokazSzczegoly(id) {
            const produkt = produkty.find(p => p.id === id);
            if (!produkt) return;

            document.getElementById('shop-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
            window.scrollTo(0, 0);

            const detailContent = document.getElementById('detail-content');
            detailContent.innerHTML = `
                <img src="${produkt.zdjęcie}" alt="${produkt.nazwa}" class="detail-img">
                <h2>${produkt.nazwa}</h2>
                <div class="detail-price">${produkt.cena}</div>
                <p class="detail-desc"><strong>Opis produktu:</strong><br>${produkt.opis}</p>
                <button class="btn-primary" onclick="alert('Produkt został dodany do koszyka!')">Kup teraz</button>
            `;
        }
    </script>

</body>
</html>
