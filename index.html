<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGzone - Sklep Pokémon TCG</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ff0055, #ffcc00, #00d2ff, #7928ca);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff; 
            margin: 0;
            padding: 0;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pasek nawigacji z koszykiem */
        .navbar {
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #ffcb05;
        }
        .logo { font-size: 1.5em; font-weight: bold; color: #ffcb05; cursor: pointer; }
        .cart-status {
            background: #ffcb05;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .cart-status:hover { transform: scale(1.05); }
        
        /* Ekran główny */
        #home-screen {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        h1 { color: #ffcb05; font-size: 3.5em; text-shadow: 3px 3px 8px rgba(0,0,0,0.9); margin-bottom: 10px; }
        .subtitle { color: #ffffff; font-size: 1.4em; font-weight: bold; margin-bottom: 35px; }
        
        .btn-primary {
            background-color: #ffcb05;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 203, 5, 0.6);
            transition: transform 0.2s;
        }
        .btn-primary:hover { transform: scale(1.08); background-color: #e6b800; }

        /* Ekran Sklepu */
        #shop-screen { display: none; padding: 40px 20px; }
        .shop-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1200px; margin: 30px auto; }
        
        .product-card { 
            border: 2px solid #ffcb05; 
            border-radius: 15px; 
            width: 270px; 
            background: rgba(26, 26, 46, 0.95); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-8px); }
        .product-img { width: 100%; height: 190px; object-fit: cover; border-bottom: 2px solid #ffcb05; }
        .product-info { padding: 15px; text-align: left; }
        .product-card h3 { color: #ffcb05; margin: 0 0 8px 0; font-size: 1.2em; }
        .product-card .price { font-size: 1.4em; font-weight: bold; color: #00ffcc; margin-top: 10px; }

        /* Ekran Szczegółów Produktu */
        #detail-screen { display: none; padding: 40px 20px; max-width: 750px; margin: 0 auto; }
        .detail-card {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffcb05;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: left;
        }
        .detail-img { width: 100%; height: 320px; object-fit: cover; border-radius: 10px; border: 2px solid #00ffcc; margin-bottom: 20px; }
        .detail-card h2 { color: #ffcb05; font-size: 2.2em; margin-top: 0; }
        .detail-price { font-size: 2em; color: #00ffcc; font-weight: bold; margin: 15px 0; }
        
        /* Wybór ilości */
        .quantity-selector { margin: 20px 0; display: flex; align-items: center; gap: 15px; }
        .quantity-selector label { font-size: 1.2em; font-weight: bold; }
        .quantity-selector input {
            width: 70px;
            padding: 8px;
            font-size: 1.2em;
            border-radius: 8px;
            border: 2px solid #ffcb05;
            background: #111;
            color: #fff;
            text-align: center;
        }

        /* Ekran Koszyka */
        #cart-screen { display: none; padding: 40px 20px; max-width: 700px; margin: 0 auto; }
        .cart-card {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffcb05;
            border-radius: 15px;
            padding: 30px;
            text-align: left;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding: 12px 0;
        }
        .payment-methods { margin-top: 30px; text-align: center; }
        .pay-btn {
            padding: 14px 25px;
            margin: 10px 5px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-blik { background-color: #eb1260; color: #fff; }
        .btn-paypal { background-color: #003087; color: #fff; }
        .btn-card { background-color: #2e7d32; color: #fff; }
        .pay-btn:hover { opacity: 0.85; }

        .back-btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #ffcb05;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Górny Pasek Nawigacji -->
    <div class="navbar">
        <div class="logo" onclick="pokazStart()">TCG Zone ⚡</div>
        <div class="cart-status" onclick="pokazKoszyk()">🛒 Koszyk (<span id="cart-count">0</span>)</div>
    </div>

    <!-- 1. EKRAN STARTOWY -->
    <div id="home-screen">
        <h1>TCG Zone</h1>
        <p class="subtitle">Oficjalny sklep z zestawami i kartami Pokémon TCG</p>
        <button class="btn-primary" onclick="otworzSklep()">Przejdź do świata Pokémon</button>
    </div>

    <!-- 2. EKRAN SKLEPU (KATALOG) -->
    <div id="shop-screen">
        <h1 style="color: #ffcb05;">Katalog Sklepu TCGzone</h1>
        <p>Kliknij w dowolny produkt, aby wybrać ilość i zobaczyć pełny opis!</p>
        
        <div class="shop-grid" id="product-list"></div>
        <button class="back-btn" onclick="pokazStart()">← Strona Główna</button>
    </div>

    <!-- 3. EKRAN SZCZEGÓŁÓW PRODUKTU Z KALKULATOREM CENY -->
    <div id="detail-screen">
        <div class="detail-card" id="detail-content"></div>
        <button class="back-btn" onclick="otworzSklep()">← Wróć do katalogu</button>
    </div>

    <!-- 4. EKRAN KOSZYKA I PŁATNOŚCI -->
    <div id="cart-screen">
        <div class="cart-card">
            <h2 style="color: #ffcb05; margin-top: 0;">Twój Koszyk 🛒</h2>
            <div id="cart-items-list">
                <p>Twój koszyk jest pusty.</p>
            </div>
            
            <h3 style="color: #00ffcc; text-align: right; margin-top: 20px;">
                Łącznie do zapłaty: <span id="cart-total">0.00 zł</span>
            </h3>

            <div class="payment-methods" id="payment-section" style="display: none;">
                <h4>Wybierz metodę płatności:</h4>
                <button class="pay-btn btn-blik" onclick="zaplac('BLIK')">Zapłać BLIK-iem</button>
                <button class="pay-btn btn-paypal" onclick="zaplac('PayPal')">Zapłać przez PayPal</button>
                <button class="pay-btn btn-card" onclick="zaplac('Karta Bankowa')">Karta Płatnicza</button>
            </div>
        </div>
        <button class="back-btn" onclick="otworzSklep()">← Kontynuuj zakupy</button>
    </div>

    <script>
        // =========================================================================
        // BAZA PRODUKTÓW - MOŻESZ TU PROSTO EDYTOWAĆ OPISY, CENY I ZDJĘCIA!
        // =========================================================================
        const produkty = [
            {
                id: 1,
                nazwa: "Elite Trainer Box 30th Anniversary",
                cenaJednostkowa: 299.00,
                zdjęcie: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80",
                opis: "Wyjątkowa, rocznicowa edycja Elite Trainer Box 30th Anniversary! Zestaw zawiera 10 specjalnych boosterów, unikalne koszulki na karty z jubileuszowym logo, metalową kostkę oraz rzadką kartę promocyjną."
            },
            {
                id: 2,
                nazwa: "Booster Box - Najnowsza Seria",
                cenaJednostkowa: 649.00,
                zdjęcie: "https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=600&q=80",
                opis: "Fabrycznie zafoliowany Booster Box zawierający aż 36 oryginalnych boosterów. Najlepszy sposób na zdobycie najrzadszych kart z nowej edycji!"
            },
            {
                id: 3,
                nazwa: "Elite Trainer Box (Standard)",
                cenaJednostkowa: 229.00,
                zdjęcie: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80",
                opis: "Oficjalny zestaw gracza TCG: 9 boosterów, przewodniki, 65 koszulek na karty, kości do gry i kolekcjonerskie pudełko z przekładkami."
            },
            {
                id: 4,
                nazwa: "Pojedynczy Booster",
                cenaJednostkowa: 21.99,
                zdjęcie: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80",
                opis: "Oryginalna saszetka z 10 losowymi kartami Pokémon TCG oraz kodem do wersji online."
            }
        ];

        let koszyk = [];
        let wyblanyProdukt = null;

        // Przełączanie ekranów
        function otworzSklep() {
            ukryjWszystkie();
            document.getElementById('shop-screen').style.display = 'block';
            window.scrollTo(0, 0);
            renderujProdukty();
        }

        function pokazStart() {
            ukryjWszystkie();
            document.getElementById('home-screen').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function pokazKoszyk() {
            ukryjWszystkie();
            document.getElementById('cart-screen').style.display = 'block';
            window.scrollTo(0, 0);
            renderujKoszyk();
        }

        function ukryjWszystkie() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('shop-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('cart-screen').style.display = 'none';
        }

        // Renderowanie listy produktów
        function renderujProdukty() {
            const kontener = document.getElementById('product-list');
            kontener.innerHTML = '';
            
            produkty.forEach(produkt => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => pokazSzczegoly(produkt.id);
                card.innerHTML = `
                    <img src="${produkt.zdjęcie}" alt="${produkt.nazwa}" class="product-img">
                    <div class="product-info">
                        <h3>${produkt.nazwa}</h3>
                        <div class="price">${produkt.cenaJednostkowa.toFixed(2)} zł</div>
                    </div>
                `;
                kontener.appendChild(card);
            });
        }

        // Otwieranie karty szczegółowej produktu z kalkulatorem
        function pokazSzczegoly(id) {
            wyblanyProdukt = produkty.find(p => p.id === id);
            if (!wyblanyProdukt) return;

            ukryjWszystkie();
            document.getElementById('detail-screen').style.display = 'block';
            window.scrollTo(0, 0);

            const detailContent = document.getElementById('detail-content');
            detailContent.innerHTML = `
                <img src="${wyblanyProdukt.zdjęcie}" class="detail-img">
                <h2>${wyblanyProdukt.nazwa}</h2>
                <p style="color: #ccc; font-size: 1.1em;">${wyblanyProdukt.opis}</p>
                
                <div class="quantity-selector">
                    <label for="ilosc">Ilość sztuk:</label>
                    <input type="number" id="ilosc" value="1" min="1" max="99" onchange="aktualizujCenePrzedmiotu()">
                </div>
                
                <div class="detail-price">Cena łącznie: <span id="total-item-price">${wyblanyProdukt.cenaJednostkowa.toFixed(2)}</span> zł</div>
                
                <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="dodajDoKoszykaZIloscia()">Dodaj do koszyka 🛒</button>
            `;
        }

        // Dynamiczne przeliczanie ceny po zmianie ilości
        function aktualizujCenePrzedmiotu() {
            const ilosc = parseInt(document.getElementById('ilosc').value) || 1;
            const suma = wyblanyProdukt.cenaJednostkowa * ilosc;
            document.getElementById('total-item-price').innerText = suma.toFixed(2);
        }

        // Dodawanie przedmiotu do koszyka
        function dodajDoKoszykaZIloscia() {
            const ilosc = parseInt(document.getElementById('ilosc').value) || 1;
            
            const istniejący = koszyk.find(item => item.id === wyblanyProdukt.id);
            if (istniejący) {
                istniejący.ilosc += ilosc;
            } else {
                koszyk.push({
                    id: wyblanyProdukt.id,
                    nazwa: wyblanyProdukt.nazwa,
                    cenaJednostkowa: wyblanyProdukt.cenaJednostkowa,
                    ilosc: ilosc
                });
            }

            aktualizujLicznikKoszyka();
            alert(`Dodano do koszyka: ${wyblanyProdukt.nazwa} (${ilosc} szt.)`);
            otworzSklep();
        }

        function aktualizujLicznikKoszyka() {
            const lacznaIlosc = koszyk.reduce((sum, item) => sum + item.ilosc, 0);
            document.getElementById('cart-count').innerText = lacznaIlosc;
        }

        // Wyświetlanie zawartości koszyka
        function renderujKoszyk() {
            const kontener = document.getElementById('cart-items-list');
            const podsumowanieTotal = document.getElementById('cart-total');
            const sekcjaPlatnosci = document.getElementById('payment-section');

            if (koszyk.length === 0) {
                kontener.innerHTML = '<p>Twój koszyk jest pusty.</p>';
                podsumowanieTotal.innerText = '0.00 zł';
                sekcjaPlatnosci.style.display = 'none';
                return;
            }

            kontener.innerHTML = '';
            let sumaCalkowita = 0;

            koszyk.forEach(item => {
                const iloscWartosc = item.cenaJednostkowa * item.ilosc;
                sumaCalkowita += iloscWartosc;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div>
                        <strong>${item.nazwa}</strong><br>
                        <small>${item.ilosc} szt. × ${item.cenaJednostkowa.toFixed(2)} zł</small>
                    </div>
                    <div style="font-weight: bold; color: #00ffcc;">${iloscWartosc.toFixed(2)} zł</div>
                `;
                kontener.appendChild(row);
            });

            podsumowanieTotal.innerText = sumaCalkowita.toFixed(2) + ' zł';
                sekcjaPlatnosci.style.display = 'block';
        }

        function zaplac(metoda) {
            alert(`Dziękujemy za złożenie zamówienia! Wybrano płatność: ${metoda}. System przekierowuje do płatności...`);
            koszyk = [];
            aktualizujLicznikKoszyka();
            pokazStart();
        }
    </script>
</body>
</html>
