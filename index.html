<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGzone</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #ffffff; text-align: center; padding: 50px; }
        h1 { color: #ffcb05; }
        .card { border: 2px solid #ffcb05; border-radius: 10px; padding: 20px; display: inline-block; margin: 10px; background: #2a2a2a; }
        .card-btn { background-color: #ffcb05; color: #000; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .card-btn:hover { background-color: #e6b800; }
    </style>
</head>
<body>
    <h1>Witaj w TCGzone!</h1>
    <p>Moja pierwsza strona o kartach kolekcjonerskich.</p>
    
    <div class="card">
        <h3>Karta #1</h3>
        <p>Opis i statystyki karty.</p>
        <button class="card-btn" onclick="alert('Kliknąłeś Kartę nr 1!')">Zobacz kartę</button>
    </div>

    <div class="card">
        <h3>Karta #2</h3>
        <p>Opis i statystyki karty.</p>
        <button class="card-btn" onclick="alert('Kliknąłeś Kartę nr 2!')">Zobacz kartę</button>
    </div>
</body>
</html>
